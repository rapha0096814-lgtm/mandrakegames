<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Iceland&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Iceland", sans-serif; }
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('./Ninja.jpg') center/cover no-repeat;
            background-color: #0f172a; padding: 20px;
        }
        .container {
            width: 420px; max-width: 100%; background-color: rgba(0,0,0,0.15);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 15px;
            color: #fff; padding: 35px 40px; box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        }
        .container h1 { font-size: 38px; text-align: center; margin-bottom: 25px; color: #e2e8f0; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .input-box { position: relative; width: 100%; height: 55px; margin: 25px 0; }
        .input-box input {
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2); border-radius: 40px; outline: none;
            font-size: 18px; color: #fff; padding: 20px 50px 20px 20px; transition: 0.3s ease;
        }
        .input-box input:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168,85,247,0.4); }
        .input-box input::placeholder { color: #cbd5e1; }
        .input-box svg { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; color: #cbd5e1; pointer-events: none; transition: 0.3s ease; }
        .input-box input:focus + svg { color: #a855f7; }
        .remember-forgot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: -10px 0 20px; font-size: 16px; }
        .remember-forgot label { display: flex; align-items: center; cursor: pointer; color: #e2e8f0; }
        .remember-forgot label input { accent-color: #a855f7; margin-right: 8px; cursor: pointer; width: 16px; height: 16px; }
        .remember-forgot a { text-decoration: none; color: #e2e8f0; transition: 0.3s; cursor: pointer; }
        .remember-forgot a:hover { color: #fff; text-decoration: underline; }
        .login {
            width: 100%; height: 55px; background-color: #fff; border: 2px solid #fff;
            border-radius: 40px; cursor: pointer; font-size: 20px; color: #0f172a;
            font-weight: 600; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 10px; transition: 0.3s ease;
        }
        .login:hover { background-color: #a855f7; border-color: #a855f7; color: #fff; }
        .register-link { font-size: 16px; text-align: center; margin: 25px 0 10px; color: #e2e8f0; }
        .register-link a { text-decoration: none; color: #a855f7; font-weight: 600; cursor: pointer; }
        .register-link a:hover { color: #fff; text-decoration: underline; }
        .msg { text-align: center; margin-top: 15px; font-size: 16px; min-height: 22px; }
        .msg.erro { color: #f87171; }
        .msg.sucesso { color: #4ade80; }
        @media (max-width: 480px) { .container { width: 100%; padding: 25px 20px; } .container h1 { font-size: 30px; } .input-box { margin: 20px 0; } }
    </style>
</head>
<body>
    <main class="container">
        <!-- LOGIN -->
        <form id="formLogin">
            <h1>Login Club</h1>
            <div class="input-box">
                <input id="emailLogin" type="email" placeholder="Usuário (e-mail)" autocomplete="email" required>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C9.243 2 7 4.243 7 7s2.243 5 5 5 5-2.243 5-5-2.243-5-5-5zm0 12c-4.411 0-8 3.589-8 8h16c0-4.411-3.589-8-8-8z"/></svg>
            </div>
            <div class="input-box">
                <input id="senhaLogin" type="password" placeholder="Senha" autocomplete="current-password" required>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9V7c0-2.757-2.243-5-5-5S7 4.243 7 7v2H5v12h14V9h-2zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v2H9V7zm7 12H8v-8h8v8z"/></svg>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox" id="lembrar"> Lembrar senha</label>
                <a id="linkEsqueci">Esqueci minha senha</a>
            </div>
            <button type="submit" class="login">Login</button>
            <div class="register-link">
                <p>Não tem uma conta? <a id="linkCadastro">Cadastre-se</a></p>
            </div>
            <div id="msgLogin" class="msg"></div>
        </form>

        <!-- CADASTRO (escondido inicialmente) -->
        <form id="formCadastro" style="display:none;">
            <h1>Cadastre-se</h1>
            <div class="input-box">
                <input id="emailCad" type="email" placeholder="E-mail" required>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C9.243 2 7 4.243 7 7s2.243 5 5 5 5-2.243 5-5-2.243-5-5-5zm0 12c-4.411 0-8 3.589-8 8h16c0-4.411-3.589-8-8-8z"/></svg>
            </div>
            <div class="input-box">
                <input id="senhaCad" type="password" placeholder="Senha (mín. 6 caracteres)" required minlength="6">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9V7c0-2.757-2.243-5-5-5S7 4.243 7 7v2H5v12h14V9h-2zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v2H9V7zm7 12H8v-8h8v8z"/></svg>
            </div>
            <button type="submit" class="login">Cadastrar</button>
            <div class="register-link">
                <p>Já tem conta? <a id="linkVoltarLogin">Fazer login</a></p>
            </div>
            <div id="msgCad" class="msg"></div>
        </form>
    </main>

    <script>
        // ---------- "Banco de dados" no localStorage ----------
        function getUsuarios() {
            return JSON.parse(localStorage.getItem('usuarios') || '[]');
        }
        function salvarUsuarios(lista) {
            localStorage.setItem('usuarios', JSON.stringify(lista));
        }

        // ---------- Alternar entre telas ----------
        const formLogin = document.getElementById('formLogin');
        const formCadastro = document.getElementById('formCadastro');
        document.getElementById('linkCadastro').onclick = () => {
            formLogin.style.display = 'none';
            formCadastro.style.display = 'block';
        };
        document.getElementById('linkVoltarLogin').onclick = () => {
            formCadastro.style.display = 'none';
            formLogin.style.display = 'block';
        };

        // ---------- CADASTRO ----------
        formCadastro.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailCad').value.trim().toLowerCase();
            const senha = document.getElementById('senhaCad').value;
            const msg = document.getElementById('msgCad');

            if (senha.length < 6) {
                msg.textContent = 'A senha precisa ter no mínimo 6 caracteres.';
                msg.className = 'msg erro';
                return;
            }
            const usuarios = getUsuarios();
            if (usuarios.some(u => u.email === email)) {
                msg.textContent = 'Este e-mail já está cadastrado!';
                msg.className = 'msg erro';
                return;
            }
            usuarios.push({ email, senha });
            salvarUsuarios(usuarios);
            msg.textContent = 'Cadastro realizado com sucesso! Faça login.';
            msg.className = 'msg sucesso';
            document.getElementById('emailCad').value = '';
            document.getElementById('senhaCad').value = '';
            setTimeout(() => {
                formCadastro.style.display = 'none';
                formLogin.style.display = 'block';
                document.getElementById('emailLogin').value = email;
            }, 1200);
        });

        // ---------- LOGIN ----------
        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailLogin').value.trim().toLowerCase();
            const senha = document.getElementById('senhaLogin').value;
            const msg = document.getElementById('msgLogin');
            const usuarios = getUsuarios();

            const usuario = usuarios.find(u => u.email === email);
            if (!usuario) {
                msg.textContent = 'E-mail não cadastrado. Faça seu cadastro!';
                msg.className = 'msg erro';
                return;
            }
            if (usuario.senha !== senha) {
                msg.textContent = 'Senha incorreta. Tente novamente.';
                msg.className = 'msg erro';
                return;
            }
          msg.textContent = 'Login realizado com sucesso! Redirecionando...';
          msg.className = 'msg sucesso';
          localStorage.setItem('usuarioLogado', JSON.stringify({ email: usuario.email }));
          if (document.getElementById('lembrar').checked) {
          localStorage.setItem('lembrarEmail', email);
          }
          setTimeout(() => {
           window.location.href = 'index.html';
           }, 1000);
        });

        // ---------- Lembrar e-mail ----------
        window.addEventListener('load', () => {
            const salvo = localStorage.getItem('lembrarEmail');
            if (salvo) {
                document.getElementById('emailLogin').value = salvo;
                document.getElementById('lembrar').checked = true;
            }
        });

        // ---------- Esqueci senha ----------
        document.getElementById('linkEsqueci').onclick = (e) => {
            e.preventDefault();
            const email = prompt('Digite seu e-mail cadastrado:');
            if (!email) return;
            const usuarios = getUsuarios();
            const u = usuarios.find(x => x.email === email.toLowerCase());
            const msg = document.getElementById('msgLogin');
            if (u) {
                msg.textContent = `Sua senha atual é: ${u.senha}`;
                msg.className = 'msg sucesso';
            } else {
                msg.textContent = 'E-mail não encontrado.';
                msg.className = 'msg erro';
            }
        };
    </script>
</body>
</html>
